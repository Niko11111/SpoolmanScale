[env:wt32-sc01-plus]
; Pinned. Unpinned, this resolved to whatever was newest at build time, both
; locally and in CI (which runs pip install --upgrade platformio). Three
; versions were installed side by side here (6.7.0, 6.9.0, 6.13.0), so the
; same commit could produce different binaries on different days.
; pioarduino 55.03.312-1 ships Arduino core 3.3.12 on ESP-IDF 5.5. Core 2.0.17
; (espressif32@6.13.0) crashed with WiFi and Bluetooth up together on this
; board, and gets no more updates. Needs PlatformIO 6.2 or newer.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; A panic prints its backtrace as raw addresses. The decoder turns them into
; file and line while the scale hangs on USB, which is the difference between
; "PANIC" and knowing where. Costs nothing at build time.
monitor_filters = esp32_exception_decoder, time
monitor_speed = 115200

; Flash & Partition
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; PSRAM - Quad (nicht OPI, nicht Disabled)
board_build.arduino.memory_type = qio_qspi

; Build Flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH=../../../../src/lv_conf.h

; The ESP-IDF options the precompiled core does not have. Building with them
; rebuilds the core once (about 4 minutes), later builds are normal.
; The board definition knows no PSRAM, so it is switched on here, Quad as
; above. The rest keeps internal RAM for what only internal RAM can hold:
; WiFi and lwIP buffers may come from PSRAM, TLS and the NimBLE host allocate
; from PSRAM, the esp_timer stack is 4 kB, and drivers for hardware this board
; does not use keep their interrupt handlers out of IRAM. TLS then costs no
; internal RAM at all: an update check left it at 149 -> 151 kB, where core 2
; dropped by 40 kB (25.09.2026).
; A line that is removed stays in sdkconfig.<env>: switch it off explicitly.
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_ESP32S3_SPIRAM_SUPPORT=y
    CONFIG_SPIRAM_MODE_QUAD=y
    CONFIG_SPIRAM_TYPE_AUTO=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=0
    CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    '# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set'
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    '# CONFIG_RMT_TX_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_RMT_RX_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_RMT_ENCODER_FUNC_IN_IRAM is not set'
    '# CONFIG_MCPWM_ISR_HANDLER_IN_IRAM is not set'
    '# CONFIG_I2S_ISR_IRAM_SAFE is not set'
    '# CONFIG_SPI_SLAVE_ISR_IN_IRAM is not set'

; Custom Fonts automatisch kopieren
extra_scripts =
    post:copy_release.py

; Libraries
lib_deps =
    lvgl/lvgl@8.3.11
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit NAU7802 Library@1.0.8
    bblanchon/ArduinoJson@7.4.3
    lovyan03/LovyanGFX@1.2.27

; SD, SPI, Preferences, WiFiClientSecure -- im ESP32-Framework enthalten

