[env:wt32-sc01-plus]
; Pinned. Unpinned, this resolved to whatever was newest at build time, both
; locally and in CI (which runs pip install --upgrade platformio). Three
; versions were installed side by side here (6.7.0, 6.9.0, 6.13.0), so the
; same commit could produce different binaries on different days.
; 6.13.0 ships Arduino core 2.0.17.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; Flash & Partition
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; PSRAM — Quad (nicht OPI, nicht Disabled)
board_build.arduino.memory_type = qio_qspi

; Build Flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH=../../../../src/lv_conf.h

; Custom Fonts automatisch kopieren
extra_scripts =
    post:copy_release.py

; Libraries
lib_deps =
    lvgl/lvgl@8.3.11
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit NAU7802 Library
    bblanchon/ArduinoJson@7.4.3
    lovyan03/LovyanGFX

; SD, SPI, Preferences, WiFiClientSecure -- im ESP32-Framework enthalten

