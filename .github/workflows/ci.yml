name: CI

# Every push to a working branch and every pull request: the house rules of
# this project as a script, and a firmware build. The release itself stays
# in build-all-boards.yml and runs on a tag push only.
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**', 'feat/**']
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']
  pull_request:
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (node --check for the page scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scripts/check.sh
        run: scripts/check.sh
      - name: Test access stamp
        run: python3 test/test_access_stamp.py
      - name: Test native tag probe
        run: python3 test/test_native_tag_probe.py
      - name: Test recheck pace
        run: python3 test/test_recheck_pace.py
      - name: Test server name
        run: python3 test/test_server_name.py
      - name: Test spool link
        run: python3 test/test_spool_link.py
      - name: Test user agent
        run: python3 test/test_user_agent.py
      - name: Test last dried
        run: python3 test/test_last_dried.py
      - name: Test spool temperature
        run: python3 test/test_spool_temp.py
      - name: Test server refusal
        run: python3 test/test_server_refusal.py
      - name: Test weight write rules
        run: python3 test/test_weight_write_rules.py
      - name: Test Bluetooth discovery
        run: python3 test/test_ble_discovery.py
      - name: Test FilaMan label orientation
        run: python3 test/test_label_fit.py
      - name: Test label raster crop
        run: python3 test/test_label_raster_crop.py
      - name: Test NIIMBOT task selection
        run: python3 test/test_niimbot_task.py
      - name: Test label empty fields
        run: python3 test/test_label_gaps.py
      - name: Test local date parser
        run: python3 test/test_local_date.py
      - name: Test accent fold
        run: python3 test/test_accent_fold.py
      - name: Test label digits
        run: python3 test/test_label_digits.py
      - name: Test card uids merge
        run: python3 test/test_card_uids_merge.py
      - name: Test spool start rules
        run: python3 test/test_spool_start.py
      - name: Test tare chain rules
        run: python3 test/test_tare_chain.py
      - name: Test calibration factor rules
        run: python3 test/test_cal_factor_rules.py
      - name: Test tag colour name
        run: python3 test/test_tag_color_name.py
      - name: Test backend job rules
        run: python3 test/test_backend_job_rules.py
      - name: Test self-deleting tasks free what they declare
        run: python3 test/test_task_self_delete.py
      - name: Test density rules
        run: python3 test/test_density_rules.py
      - name: Test filament field rules
        run: python3 test/test_filament_field_rules.py
      - name: Test the FilaMan spool list filter
        run: python3 test/test_filaman_list_filter.py
      - name: Test the TSPL job for Phomemo shipping label printers
        run: python3 test/test_tspl_job.py

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [wt32-sc01-plus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned like the platform and the libraries: 6.2.0.post1 reports itself
      # as 6.2.0-post.1, which the pinned platform reads as older than the
      # 6.2.0 it requires, and every build stopped there (27.10.2026).
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      # The platform builds part of the firmware in its own Python environment
      # (~/.platformio/penv) and installs "pioarduino>=6.2.0" there, which
      # now resolves to 6.2.0.post1 with the same version string problem.
      # Created here with 6.2.0, the platform finds it satisfied and keeps it.
      - name: Pin PlatformIO inside the platform's environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install --quiet pioarduino==6.2.0
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Refuse a binary an installed device could not take
        # Installs since v0.8.0 get 6 MB app slots (partitions.csv). Since
        # v0.8.3 the firmware may outgrow the 3 MB slots of scales flashed
        # before that: such a scale reads the size from version.json, offers
        # the web flasher instead of the update, and moves to the new table
        # over USB once. More than 6 MB fits no device at all.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 6291456"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 6 MB app slot"
            exit 1
          fi
      # Here rather than in the house-rules job: both tools measure icons from
      # LVGL's symbol header, and that only exists once the build has unpacked
      # the library.
      - name: French column and width budgets
        run: |
          if [ -f tools/lang_fr.py ]; then
            python3 tools/lang_fr.py check
            python3 tools/fit_check.py --gate
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
